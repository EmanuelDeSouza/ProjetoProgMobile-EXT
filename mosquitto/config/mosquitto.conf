# CuidaLar · Mosquitto 2 com autenticação obrigatória (RNF-07).
# Usuários e ACLs ficam no plugin "dynamic security" e são criados pela API:
#   - cuidalar-api ......... admin (criado pelo entrypoint na primeira subida)
#   - provisionamento ...... só anuncia código e recebe credencial cifrada (SPEC 6.3)
#   - <id do dispositivo> .. só os próprios tópicos cuidalar/{residencia}/{dispositivo}/...
per_listener_settings false
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Desenvolvimento (rede local / emulador)
listener 1883

# Produção: TLS na 8883. Gere os certificados com mosquitto/gerar-certificados.sh
# e descomente o bloco abaixo (o firmware usa MQTT_TLS=1 e a CA em ca.crt).
#listener 8883
#cafile /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/server.crt
#keyfile /mosquitto/certs/server.key
#tls_version tlsv1.2
